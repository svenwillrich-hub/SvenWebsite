<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Sven-Erik Willrich</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
  --bg:#06080d;
  --card:#111722;
  --accent:#4f8ff7;
  --accent2:#7c5cfc;
  --accent3:#06d6a0;
  --text:#e8edf5;
  --muted:#7a8ba7;
  --border:rgba(79,143,247,.12);
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

/* === AMBIENT BACKGROUND === */
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.35;animation:drift 20s ease-in-out infinite}
.bg-orbs .orb:nth-child(1){width:600px;height:600px;background:var(--accent2);top:-15%;left:-10%;animation-delay:0s}
.bg-orbs .orb:nth-child(2){width:500px;height:500px;background:var(--accent);bottom:-10%;right:-10%;animation-delay:-7s}
.bg-orbs .orb:nth-child(3){width:400px;height:400px;background:var(--accent3);top:50%;left:40%;animation-delay:-14s;opacity:.15}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.05)}66%{transform:translate(-20px,30px) scale(.95)}}

/* === GRAIN === */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* === LANG === */
.lang{position:fixed;top:1.5rem;right:2rem;z-index:100;display:flex;gap:2px;background:rgba(12,16,24,.8);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:8px;padding:3px}
.lang button{background:none;border:none;color:var(--muted);padding:6px 14px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;letter-spacing:.06em;transition:all .3s}
.lang button.active{background:var(--accent);color:#fff}
.lang button:hover:not(.active){color:var(--text)}

/* === CARD === */
.card{
  position:relative;z-index:2;
  max-width:560px;width:100%;
  margin:2rem;
  background:rgba(17,23,34,.7);
  backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:3.5rem 3rem;
  text-align:center;
}
.card::before{
  content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;z-index:-1;
  background:linear-gradient(135deg,rgba(79,143,247,.2),rgba(124,92,252,.1),rgba(6,214,160,.15));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* === NAME === */
.name{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;line-height:1.15;margin-bottom:.4rem}
.name .accent{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title-line{font-size:.85rem;color:var(--muted);font-weight:300;letter-spacing:.02em}

/* === DIVIDER === */
.divider{
  width:48px;height:2px;margin:2rem auto;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:2px;
}

/* === FOCUS AREAS === */
.focus{margin-bottom:2rem}
.focus-label{font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2rem}
.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.pill{
  position:relative;
  padding:.85rem 1rem;
  border-radius:12px;
  font-size:.78rem;
  font-weight:500;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  cursor:default;
  overflow:hidden;
  transition:all .45s cubic-bezier(.25,.8,.25,1);
}
/* glow layer */
.pill::before{
  content:'';position:absolute;inset:0;border-radius:12px;opacity:0;
  transition:opacity .45s;
}
.pill:nth-child(1)::before{background:linear-gradient(135deg,rgba(79,143,247,.15),rgba(124,92,252,.1))}
.pill:nth-child(2)::before{background:linear-gradient(135deg,rgba(124,92,252,.15),rgba(6,214,160,.1))}
.pill:nth-child(3)::before{background:linear-gradient(135deg,rgba(6,214,160,.15),rgba(244,162,97,.1))}
.pill:nth-child(4)::before{background:linear-gradient(135deg,rgba(244,162,97,.15),rgba(79,143,247,.1))}
.pill:nth-child(5)::before{background:linear-gradient(135deg,rgba(79,143,247,.12),rgba(6,214,160,.12))}
.pill:nth-child(6)::before{background:linear-gradient(135deg,rgba(124,92,252,.12),rgba(244,162,97,.12))}
/* shine sweep */
.pill::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  transition:left .6s ease;
}
.pill:hover::before{opacity:1}
.pill:hover::after{left:120%}
.pill:hover{
  color:var(--text);
  border-color:rgba(79,143,247,.35);
  transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(79,143,247,.12),0 0 1px rgba(79,143,247,.3);
}
/* icon */
.pill .p-icon{
  display:block;font-size:1.2rem;margin-bottom:.3rem;
  transition:transform .4s cubic-bezier(.25,.8,.25,1);
}
.pill:hover .p-icon{transform:scale(1.15)}
.pill .p-text{position:relative;z-index:1}
/* wide pill spans two columns */
.pill.wide{grid-column:1 / -1;text-align:center}

/* === CONTACT LINKS === */
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem 1.5rem}
.link{
  display:inline-flex;align-items:center;gap:.45rem;
  font-size:.8rem;color:var(--muted);
  text-decoration:none;transition:color .3s;
}
.link:hover{color:var(--accent)}
.link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* === FOOTER === */
.foot{margin-top:2.5rem;font-size:.65rem;color:var(--muted);opacity:.4}

/* === RESPONSIVE === */
@media(max-width:480px){
  .card{margin:1rem;padding:2.5rem 1.5rem}
  .lang{top:.75rem;right:.75rem}
}
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="grain"></div>

<div class="lang">
  <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
  <button id="btn-de" onclick="setLang('de')">DE</button>
</div>

<div class="card">

  <h1 class="name">Dr. Sven-Erik<br><span class="accent">Willrich</span></h1>
  <p class="title-line" data-en="Consultant · Lecturer · Author" data-de="Berater · Dozent · Autor"></p>

  <div class="divider"></div>

  <!-- FOCUS -->
  <div class="focus">
    <div class="focus-label" data-en="Focus Areas" data-de="Schwerpunkte"></div>
    <div class="pills">
      <span class="pill"><span class="p-icon">⟁</span><span class="p-text">Data & AI Strategy</span></span>
      <span class="pill"><span class="p-icon">⬡</span><span class="p-text">Data Governance</span></span>
      <span class="pill"><span class="p-icon">◎</span><span class="p-text">Data Operating Model</span></span>
      <span class="pill"><span class="p-icon">◈</span><span class="p-text">Master Data Management</span></span>
      <span class="pill"><span class="p-icon">⟐</span><span class="p-text" data-en="Digital Transformation" data-de="Digitale Transformation"></span></span>
      <span class="pill"><span class="p-icon">▲</span><span class="p-text" data-en="Data-Driven Company" data-de="Datengetriebenes Unternehmen"></span></span>
    </div>
  </div>

  <!-- CONTACT -->
  <div class="links">
    <a class="link" href="mailto:mail@svenwillrich.de">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      mail@svenwillrich.de
    </a>
    <a class="link" href="https://www.linkedin.com/in/dr-sven-willrich/" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      LinkedIn
    </a>
    <span class="link" style="cursor:default">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Berlin
    </span>
  </div>

  <div class="foot">© 2026 Dr. Sven-Erik Willrich</div>

</div>

<script>
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.getAttribute('data-'+l)});
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.getElementById('btn-de').classList.toggle('active',l==='de');
  try{localStorage.setItem('lang',l)}catch(e){}
}
try{const s=localStorage.getItem('lang');s?setLang(s):setLang('en')}catch(e){setLang('en')}
</script>

</body>
</html>
